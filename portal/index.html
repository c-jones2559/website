<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Portal | Chris Jones</title>
    
    <!-- Local NeoBrutalism CSS file -->
    <link rel="stylesheet" href="../neobrutalism.css" />
    
    <!-- Google Fonts for Lexend Mega -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../style.css">
    
    <script>
      (function() {
        const saved = localStorage.getItem('theme-preference');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode');
        }
      })();
    </script>
    
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../icon-512.png" type="image/png">
  </head>
  <body>

    <header>
      <div class="logo-group">
        <a href="https://cjones.cymru">
          <img src="../icon-512.png" alt="CJ logo" style="border-radius: 0; border: none;">
        </a>
        <h2 style="margin: 0;">Chris Jones</h2>
      </div>
      <nav>
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle dark/light mode">
          <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="https://cjones.cymru" style="text-decoration: none;">
          <button type="button" class="contact-btn">Go Back Home</button>
        </a>
      </nav>
    </header>

    <main>
      <section class="hero-banner bg-blue">
        <h1>Portal</h1>
        <p>Access all your self-hosted services right here.</p>
      </section>
      
      <section>
        <div class="grid-container">
          
          <!-- Global Links Box -->
          <article class="grid-article brutalist-box bg-mint">
            <div class="card-content">
              <h3 style="margin-top: 0;">Global links</h3>
              <p style="margin-bottom: 1.5rem;">These links can be used anywhere through wifi!</p>
              
              <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a href="https://cjones.cymru" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Home</button>
                </a>
                <a href="https://cloud.cjones.cymru" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Nextcloud</button>
                </a>
                <a href="https://jelly.cjones.cymru" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Jellyfin</button>
                </a>
                <a href="https://sesquipedalia.cjones.cymru" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Sesquipedalia</button>
                </a>
                <a href="https://cjones.cymru/discord" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Discord bot</button>
                </a>
              </div>
            </div>
          </article>

          <!-- Local Links Box -->
          <article class="grid-article brutalist-box bg-yellow">
            <div class="card-content">
              <h3 style="margin-top: 0;">Local links</h3>
              <p style="margin-bottom: 1.5rem;">These links can only be used if you're connected to the same wi-fi as the server.</p>

              <h4 style="margin-top: 0; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;">
                <label class="switch">
                  <input type="checkbox" id="locationSwitch">
                  <span class="slider"></span>
                </label>
                <span id="locationText">Home</span>
              </h4>

              <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a id="home" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Home</button>
                </a>
                <a id="jellyfin" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Jellyfin</button>
                </a>
                <a id="sesquipedalia" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Sesquipedalia</button>
                </a>
                <a id="npm" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">NPM admin</button>
                </a>
                <a id="cadvisor" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">cAdvisor</button>
                </a>
                <a id="grafana" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">Grafana</button>
                </a>
                <a id="qBitTorrent" href="#" style="text-decoration: none; flex-grow: 1;">
                  <button type="button" class="contact-btn" style="width: 100%; background-color: #fff;">qBitTorrent</button>
                </a>
              </div>
            </div>
          </article>

        </div>
      </section>
    </main>

    <script src="index.js"></script>
    <script src="../theme.js" defer></script>
  </body>
</html>
